<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blunt Roll</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f;
    --bg-raised: #12141a;
    --bg-tile: #1a1d26;
    --line: rgba(255,255,255,0.08);
    --cyan: #2dd4e8;
    --cyan-dim: rgba(45,212,232,0.15);
    --red: #e8384f;
    --red-dim: rgba(232,56,79,0.15);
    --ink: #f0f0f2;
    --ink-dim: #7d818c;
    --gold: #f0b93d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    padding-bottom: 24px;
    user-select: none;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 18px; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .brand .icon { color: var(--cyan); }
  .balance-pill {
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 100px; padding: 7px 14px;
    display: flex; align-items: center; gap: 7px;
    font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 0.95rem;
  }
  .balance-pill .coin { color: var(--gold); }

  main { padding: 18px; max-width: 460px; margin: 0 auto; }

  .controls-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .mines-select {
    flex: 1; background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .mines-select .step-btn {
    background: none; border: none; color: var(--ink-dim);
    font-size: 1.2rem; font-weight: 700; cursor: pointer; padding: 0 8px;
  }
  .mines-select .step-btn:active { color: var(--cyan); }
  .mines-select .val { font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .mines-select .label { color: var(--ink-dim); font-size: 0.82rem; }

  .bet-row {
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .bet-row .bet-label { color: var(--ink-dim); font-size: 0.8rem; margin-bottom: 4px; }
  .bet-input {
    background: none; border: none; color: var(--ink); font-size: 1.3rem;
    font-weight: 700; font-family: 'JetBrains Mono', monospace; width: 100%;
    outline: none;
  }
  .bet-quick { display: flex; gap: 6px; }
  .bet-quick button {
    background: var(--bg-tile); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 6px; padding: 6px 10px; font-size: 0.75rem; font-weight: 600;
    cursor: pointer;
  }
  .bet-quick button:active { border-color: var(--cyan); color: var(--cyan); }

  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    margin-bottom: 18px;
  }
  .tile {
    aspect-ratio: 1; background: var(--bg-tile); border: 1px solid var(--line);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; cursor: pointer; transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .tile:active { transform: scale(0.94); }
  .tile.gem { background: var(--cyan-dim); border-color: var(--cyan); }
  .tile.bomb { background: var(--red-dim); border-color: var(--red); }
  .tile.disabled { pointer-events: none; }
  .tile.dim { opacity: 0.35; }

  .stats-row {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .stat-box {
    flex: 1; background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; text-align: center;
  }
  .stat-box .stat-label { color: var(--ink-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-box .stat-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.1rem; margin-top: 4px; color: var(--cyan); }

  .action-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    font-weight: 800; font-size: 1.05rem; cursor: pointer; transition: opacity 0.2s ease;
  }
  .action-btn.start { background: var(--cyan); color: #06171a; }
  .action-btn.cashout { background: var(--gold); color: #241a02; }
  .action-btn:disabled { opacity: 0.4; pointer-events: none; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 20px; font-weight: 700; font-size: 0.9rem;
    opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none; z-index: 50; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.win { border-color: var(--cyan); color: var(--cyan); }
  .toast.lose { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="icon">◆</span> Blunt Roll</div>
  <div class="balance-pill"><span class="coin">●</span><span id="balanceDisplay">--</span></div>
</header>

<main>
  <div class="controls-row">
    <div class="mines-select">
      <button class="step-btn" id="minesDown">−</button>
      <div style="text-align:center;">
        <div class="val" id="minesVal">3</div>
        <div class="label">mines</div>
      </div>
      <button class="step-btn" id="minesUp">+</button>
    </div>
  </div>

  <div class="bet-row">
    <div style="flex:1;">
      <div class="bet-label">Bet amount</div>
      <input type="number" class="bet-input" id="betInput" value="10" min="1">
    </div>
    <div class="bet-quick">
      <button data-mult="0.5">½</button>
      <button data-mult="2">2×</button>
      <button data-max="1">Max</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-label">Multiplier</div>
      <div class="stat-val" id="multDisplay">1.00×</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Payout</div>
      <div class="stat-val" id="payoutDisplay">0</div>
    </div>
  </div>

  <button class="action-btn start" id="actionBtn">Start</button>
</main>

<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

  const SUPABASE_URL = 'https://oxbfudydgobdfxnqafvo.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_GPRVCXr0AVH7DvF0fqcBlA_28JKUNGI'
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  // --- Telegram WebApp user identification ---
  const tg = window.Telegram?.WebApp
  tg?.ready()
  tg?.expand()

  const tgUser = tg?.initDataUnsafe?.user
  const userId = tgUser?.id ? String(tgUser.id) : 'guest_' + Math.floor(Math.random() * 1000000)
  const username = tgUser?.username || tgUser?.first_name || 'guest'

  let balance = 0

  async function loadBalance() {
    const { data, error } = await supabase
      .from('balances')
      .select('coins')
      .eq('user_id', userId)
      .maybeSingle()

    if (error) {
      console.error('balance load error', error)
      balance = 100 // fallback so the game is still playable if backend hiccups
    } else if (!data) {
      // first time seeing this user — give starting balance
      balance = 100
      await supabase.from('balances').insert([{ user_id: userId, username, coins: balance }])
    } else {
      balance = data.coins
    }
    renderBalance()
  }

  async function saveBalance() {
    await supabase
      .from('balances')
      .update({ coins: balance })
      .eq('user_id', userId)
  }

  function renderBalance() {
    document.getElementById('balanceDisplay').textContent = balance
  }

  // --- Mines game state ---
  const GRID_SIZE = 25
  let minesCount = 3
  let betAmount = 10
  let gameActive = false
  let bombPositions = new Set()
  let revealedCount = 0
  let currentMult = 1.0

  const gridEl = document.getElementById('grid')
  const minesValEl = document.getElementById('minesVal')
  const betInputEl = document.getElementById('betInput')
  const multDisplayEl = document.getElementById('multDisplay')
  const payoutDisplayEl = document.getElementById('payoutDisplay')
  const actionBtn = document.getElementById('actionBtn')
  const toastEl = document.getElementById('toast')

  function buildGrid() {
    gridEl.innerHTML = ''
    for (let i = 0; i < GRID_SIZE; i++) {
      const tile = document.createElement('div')
      tile.className = 'tile'
      tile.dataset.index = i
      tile.addEventListener('click', () => onTileClick(i, tile))
      gridEl.appendChild(tile)
    }
  }

  function showToast(msg, type) {
    toastEl.textContent = msg
    toastEl.className = `toast show ${type}`
    setTimeout(() => { toastEl.className = 'toast' }, 1800)
  }

  // multiplier math: probability of surviving `picks` reveals with `mines` bombs
  // among 25 tiles, then invert for fair odds, apply a small house edge
  function computeMultiplier(mines, picks) {
    const HOUSE_EDGE = 0.97
    let prob = 1
    for (let i = 0; i < picks; i++) {
      prob *= (GRID_SIZE - mines - i) / (GRID_SIZE - i)
    }
    return (1 / prob) * HOUSE_EDGE
  }

  function updateStatsDisplay() {
    currentMult = revealedCount === 0 ? 1.0 : computeMultiplier(minesCount, revealedCount)
    multDisplayEl.textContent = currentMult.toFixed(2) + '×'
    payoutDisplayEl.textContent = Math.floor(betAmount * currentMult)
  }

  function startGame() {
    betAmount = parseFloat(betInputEl.value) || 0
    if (betAmount <= 0) { showToast('Enter a valid bet', 'lose'); return }
    if (betAmount > balance) { showToast('Not enough coins', 'lose'); return }

    balance -= betAmount
    renderBalance()
    saveBalance()

    gameActive = true
    revealedCount = 0
    bombPositions = new Set()
    while (bombPositions.size < minesCount) {
      bombPositions.add(Math.floor(Math.random() * GRID_SIZE))
    }

    buildGrid()
    updateStatsDisplay()
    actionBtn.textContent = 'Cashout'
    actionBtn.className = 'action-btn cashout'
    betInputEl.disabled = true
  }

  function onTileClick(index, tileEl) {
    if (!gameActive || tileEl.classList.contains('gem') || tileEl.classList.contains('bomb')) return

    if (bombPositions.has(index)) {
      // hit a bomb — reveal all, lose
      document.querySelectorAll('.tile').forEach(t => {
        const i = parseInt(t.dataset.index)
        if (bombPositions.has(i)) {
          t.classList.add('bomb')
          t.textContent = '💣'
        }
        t.classList.add('disabled')
      })
      tileEl.classList.add('bomb')
      endGame(false)
    } else {
      tileEl.classList.add('gem')
      tileEl.textContent = '💎'
      revealedCount++
      updateStatsDisplay()

      const safeTiles = GRID_SIZE - minesCount
      if (revealedCount === safeTiles) {
        // cleared the whole board
        cashout()
      }
    }
  }

  function cashout() {
    if (!gameActive || revealedCount === 0) return
    const payout = Math.floor(betAmount * currentMult)
    balance += payout
    renderBalance()
    saveBalance()
    showToast(`+${payout} coins`, 'win')
    endGame(true)
  }

  function endGame(won) {
    gameActive = false
    document.querySelectorAll('.tile').forEach(t => t.classList.add('disabled'))
    if (!won) showToast(`Lost ${betAmount} coins`, 'lose')
    actionBtn.textContent = 'Start'
    actionBtn.className = 'action-btn start'
    betInputEl.disabled = false
    setTimeout(buildGrid, 900)
  }

  actionBtn.addEventListener('click', () => {
    if (gameActive) cashout()
    else startGame()
  })

  document.getElementById('minesUp').addEventListener('click', () => {
    if (gameActive) return
    minesCount = Math.min(24, minesCount + 1)
    minesValEl.textContent = minesCount
  })
  document.getElementById('minesDown').addEventListener('click', () => {
    if (gameActive) return
    minesCount = Math.max(1, minesCount - 1)
    minesValEl.textContent = minesCount
  })

  document.querySelectorAll('.bet-quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (gameActive) return
      const current = parseFloat(betInputEl.value) || 0
      if (btn.dataset.mult) {
        betInputEl.value = Math.max(1, Math.floor(current * parseFloat(btn.dataset.mult)))
      } else if (btn.dataset.max) {
        betInputEl.value = Math.floor(balance)
      }
    })
  })

  buildGrid()
  loadBalance()
</script>

</body>
</html>
